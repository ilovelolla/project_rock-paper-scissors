<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<h1 class="title"> ROCK PAPER SCISSORS</h1>

<div class="main">

 <div class="one">
    <div id="txt">
        Pick your weapon! <br>The first to reach 5 points claims victory</div>
 </div>

<div class="two">
        <div id="computerScore">Computer: 0</div>
        <div id="humanScore">Player: 0</div>
</div>

<div id="result"></div>

 <div class="three">
    <button id ="rockBtn">✊</button>
    <button id ="paperBtn">✋</button>
    <button id ="scissorsBtn">✌️</button>
</div>
<div id="playAgain">Play Again</div>

</div>
